<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131a">
<title>Study Tracker</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#181d27;--soft:#202735;--text:#edf1f7;--muted:#9ba6b7;--accent:#8b7cff;--green:#4fd1a1;--red:#ff7185;--border:#2c3443;--radius:16px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top left,rgba(139,124,255,.13),transparent 38rem),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{width:min(1100px,calc(100% - 32px));margin:auto;padding:42px 0 56px}header{margin-bottom:28px}h1{margin:0;font-size:clamp(1.8rem,4vw,2.5rem);letter-spacing:-.04em}header p{margin:8px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:20px;align-items:start}.panel{background:rgba(24,29,39,.96);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:0 16px 40px #0003}.panel+.panel{margin-top:20px}h2{margin:0 0 16px;font-size:1.1rem;letter-spacing:-.02em}.muted{color:var(--muted)}
.form-row{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px}input,select{width:100%;min-width:0;padding:11px 12px;color:var(--text);background:#111620;border:1px solid var(--border);border-radius:10px;outline:none;font:inherit}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b7cff26}
button{border:0;border-radius:10px;padding:10px 14px;color:white;background:var(--accent);font:inherit;font-weight:650;cursor:pointer;transition:.15s}button:hover:not(:disabled){background:#a394ff;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{color:var(--text);background:var(--soft);border:1px solid var(--border)}button.secondary:hover:not(:disabled){background:#2a3343}button.danger{color:#ffdce1;background:#ff718522;border:1px solid #ff718552}button.danger:hover:not(:disabled){background:#ff718538}button.small{padding:7px 10px;font-size:.86rem}
.subject-list{display:grid;gap:12px}.subject-card{padding:16px;background:#141a24;border:1px solid var(--border);border-radius:13px}.subject-top,.subject-meta,.history-item,.timer-actions,.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.subject-name{font-weight:700;overflow-wrap:anywhere}.subject-meta{margin-top:10px;color:var(--muted);font-size:.9rem}.percent{color:var(--text);font-weight:700;white-space:nowrap}.progress-track{height:9px;margin-top:12px;overflow:hidden;background:#2b3341;border-radius:999px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#55d6b0);border-radius:inherit;transition:width .3s}.empty{padding:24px 16px;color:var(--muted);text-align:center;border:1px dashed #3a4353;border-radius:12px}
.timer-display{margin:18px 0;padding:20px 12px;background:#111620;border:1px solid var(--border);border-radius:13px;text-align:center;font:700 clamp(2rem,8vw,3rem)/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em;font-variant-numeric:tabular-nums}.timer-status{min-height:22px;margin-top:10px;color:var(--muted);font-size:.88rem}.timer-actions{justify-content:stretch}.timer-actions button{flex:1}.reset-row{margin-top:16px;display:flex;justify-content:flex-end}
.history-list{display:grid;gap:8px;max-height:300px;overflow:auto;padding-right:4px}.history-item{padding:12px;background:#141a24;border:1px solid var(--border);border-radius:10px;align-items:flex-start}.history-subject{font-weight:650}.history-date{color:var(--muted);font-size:.82rem}.history-duration{color:var(--green);font-weight:700;white-space:nowrap}
@media(max-width:760px){.layout{grid-template-columns:1fr}.form-row{grid-template-columns:1fr 110px}.form-row button{grid-column:1/-1}}@media(max-width:420px){.app{width:calc(100% - 20px);padding-top:26px}.panel{padding:16px}.form-row{grid-template-columns:1fr}.form-row button{grid-column:auto}.subject-meta{align-items:flex-start;flex-direction:column;gap:4px}}
</style>
</head>
<body>
<main class="app">
<header><h1>Study Tracker</h1><p>Set your goals, focus on a subject, and keep track of your progress.</p></header>
<div class="layout"><div>
<section class="panel"><div class="section-heading"><h2>Manage Subjects</h2><span class="muted" id="subject-count">0 subjects</span></div>
<form id="subject-form" class="form-row"><input id="subject-name" type="text" placeholder="Subject or task name" maxlength="80" required><input id="target-hours" type="number" placeholder="Target hours" min="0.01" step="0.01" required aria-label="Target hours"><button type="submit">Add Subject</button></form><div class="subject-list" id="subject-list" style="margin-top:16px"></div></section>
<section class="panel"><h2>Session History</h2><div class="history-list" id="history-list"></div></section>
</div><aside><section class="panel"><h2>Focus Timer</h2><label class="muted" for="subject-select">Choose a subject</label><select id="subject-select" style="margin-top:7px"></select><div class="timer-display" id="timer-display" role="timer">00:00:00</div><div class="timer-actions"><button id="start-btn" type="button">Start</button><button id="pause-btn" type="button" class="secondary" disabled>Pause</button><button id="save-btn" type="button" class="secondary" disabled>Stop &amp; Save</button></div><div class="timer-status" id="timer-status" aria-live="polite">Add a subject to begin.</div><div class="reset-row"><button id="reset-btn" type="button" class="danger small">Reset All Data</button></div></section></aside></div></main>
<script>
(function(){
"use strict";
var KEY="universalStudyTracker.v1",q=function(s){return document.querySelector(s)},form=q("#subject-form"),nameInput=q("#subject-name"),targetInput=q("#target-hours"),list=q("#subject-list"),select=q("#subject-select"),historyList=q("#history-list"),display=q("#timer-display"),status=q("#timer-status"),start=q("#start-btn"),pause=q("#pause-btn"),save=q("#save-btn"),reset=q("#reset-btn"),data=load(),elapsed=0,startedAt=null,ticker=null;
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(!d||!Array.isArray(d.subjects)||!Array.isArray(d.sessions))return{subjects:[],sessions:[]};return{subjects:d.subjects.filter(function(s){return s&&typeof s.id==="string"&&typeof s.name==="string"&&Number(s.targetHours)>0&&Number.isFinite(Number(s.totalSeconds))}),sessions:d.sessions.filter(function(s){return s&&typeof s.subjectName==="string"&&Number(s.seconds)>0&&Number.isFinite(Date.parse(s.endedAt))})}}catch(e){return{subjects:[],sessions:[]}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){status.textContent="Could not save data in this browser."}}
function duration(value){var n=Math.max(0,Math.floor(value));return[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(function(x){return String(x).padStart(2,"0")}).join(":")}
function render(){renderSubjects();renderSelect();renderHistory();updateTimer()}
function renderSubjects(){list.replaceChildren();q("#subject-count").textContent=data.subjects.length+" "+(data.subjects.length===1?"subject":"subjects");if(!data.subjects.length){list.innerHTML='<div class="empty">No subjects yet. Add one above to get started.</div>';return}data.subjects.forEach(function(s){var card=document.createElement("article"),top=document.createElement("div"),title=document.createElement("div"),del=document.createElement("button");card.className="subject-card";top.className="subject-top";title.className="subject-name";title.textContent=s.name;del.type="button";del.className="danger small";del.textContent="Delete";del.setAttribute("aria-label","Delete "+s.name);del.addEventListener("click",function(){deleteSubject(s.id)});top.append(title,del);var hours=s.totalSeconds/3600,target=Number(s.targetHours),pct=Math.min(100,hours/target*100),meta=document.createElement("div"),amount=document.createElement("span"),percent=document.createElement("span");meta.className="subject-meta";amount.textContent=hours.toFixed(2)+" h studied · "+target.toFixed(2)+" h target";percent.className="percent";percent.textContent=pct.toFixed(1)+"%";meta.append(amount,percent);var track=document.createElement("div"),fill=document.createElement("div");track.className="progress-track";track.setAttribute("role","progressbar");track.setAttribute("aria-label",s.name+" progress");track.setAttribute("aria-valuemin","0");track.setAttribute("aria-valuemax","100");track.setAttribute("aria-valuenow",pct.toFixed(1));fill.className="progress-fill";fill.style.width=pct+"%";track.append(fill);card.append(top,meta,track);list.append(card)})}
function renderSelect(){var prior=select.value;select.replaceChildren();if(!data.subjects.length){select.add(new Option("No subjects available",""));select.disabled=true;return}select.disabled=false;data.subjects.forEach(function(s){select.add(new Option(s.name,s.id))});if(data.subjects.some(function(s){return s.id===prior}))select.value=prior}
function renderHistory(){historyList.replaceChildren();if(!data.sessions.length){historyList.innerHTML='<div class="empty">Saved study sessions will appear here.</div>';return}[].concat(data.sessions).sort(function(a,b){return Date.parse(b.endedAt)-Date.parse(a.endedAt)}).forEach(function(s){var row=document.createElement("div"),info=document.createElement("div"),subject=document.createElement("div"),date=document.createElement("div"),time=document.createElement("div");row.className="history-item";subject.className="history-subject";subject.textContent=s.subjectName;date.className="history-date";date.textContent=new Date(s.endedAt).toLocaleString();time.className="history-duration";time.textContent=duration(s.seconds);info.append(subject,date);row.append(info,time);historyList.append(row)})}
function current(){return elapsed+(startedAt?(Date.now()-startedAt)/1000:0)}
function updateTimer(){display.textContent=duration(current());var running=startedAt!==null,hasTime=elapsed>0||running,hasSubjects=data.subjects.length>0;start.disabled=!hasSubjects||running;pause.disabled=!running;save.disabled=!hasTime;if(!hasSubjects)status.textContent="Add a subject to begin.";else if(running){var s=data.subjects.find(function(x){return x.id===select.value});status.textContent="Studying "+(s?s.name:"selected subject")+"…"}else status.textContent=hasTime?"Timer paused. Resume or save your session.":"Ready when you are."}
function stopTicker(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function deleteSubject(id){var s=data.subjects.find(function(x){return x.id===id});if(!s)return;if(startedAt&&select.value===id){elapsed=current();startedAt=null;stopTicker()}data.subjects=data.subjects.filter(function(x){return x.id!==id});persist();render()}
form.addEventListener("submit",function(e){e.preventDefault();var name=nameInput.value.trim(),target=Number(targetInput.value);if(!name||!Number.isFinite(target)||target<=0){status.textContent="Enter a name and a target greater than zero.";return}data.subjects.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),name:name,targetHours:target,totalSeconds:0});persist();form.reset();nameInput.focus();render()});
start.addEventListener("click",function(){if(!data.subjects.length||!select.value)return;startedAt=Date.now();ticker=setInterval(updateTimer,250);updateTimer()});
pause.addEventListener("click",function(){if(startedAt===null)return;elapsed=current();startedAt=null;stopTicker();updateTimer()});
save.addEventListener("click",function(){var seconds=Math.floor(current()),s=data.subjects.find(function(x){return x.id===select.value});if(seconds>0&&s){s.totalSeconds+=seconds;data.sessions.push({subjectName:s.name,seconds:seconds,endedAt:new Date().toISOString()});persist()}elapsed=0;startedAt=null;stopTicker();render()});
select.addEventListener("change",function(){if(startedAt!==null){elapsed=current();startedAt=null;stopTicker()}elapsed=0;updateTimer()});
reset.addEventListener("click",function(){if(!confirm("Reset all subjects, study totals, and session history? This cannot be undone."))return;localStorage.removeItem(KEY);data={subjects:[],sessions:[]};elapsed=0;startedAt=null;stopTicker();render()});
render()
})();
</script></body></html>
